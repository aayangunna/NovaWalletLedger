services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      POSTGRES_PASSWORD: novawallet
    ports:
      - "5432:5432"
    volumes:
      - novawallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=db;Port=5432;Database=novawallet;Username=novawallet;Password=novawallet"
      # Dev-only mock-issuer signing key — override with a strong secret (and a
      # real OIDC provider) before ever running this outside a local demo.
      Jwt__SigningKey: "docker-compose-dev-signing-key-change-me-min-32-bytes"
    depends_on:
      db:
        condition: service_healthy

volumes:
  novawallet-db-data:
